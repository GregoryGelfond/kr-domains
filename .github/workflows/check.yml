# Corpus-drift gate. Every change must keep the corpus self-verifying: this runs the same gate as
# local development — `pixi run check`, which is `elenctic .` over every contract-bearing case on
# clingo and clingcon — against the committed lockfile, so the run is reproducible. There is no lint
# or type-check step: the corpus is pure .lp, with no Python harness. elenctic is a public
# dependency, so no credentials are needed.

name: check

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          locked: true
      - run: pixi run check
